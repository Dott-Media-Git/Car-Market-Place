workflows:
  store-audit:
    name: Verify submission and select build 2
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Car Market Place (Admin)
    scripts:
      - name: Select processed build and inspect remaining fields
        script: |
          python3 -m venv /tmp/store-tools
          /tmp/store-tools/bin/pip install 'PyJWT[crypto]' requests
          /tmp/store-tools/bin/python scripts/audit-submission.py
    artifacts:
      - store-artifacts/**
  store-upload:
    name: Upload inspected store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 15
    integrations:
      app_store_connect: Car Market Place (Admin)
    scripts:
      - name: Upload inspected screenshots and listing details
        script: |
          python3 -m venv /tmp/store-tools
          /tmp/store-tools/bin/pip install 'PyJWT[crypto]' requests
          /tmp/store-tools/bin/python scripts/upload-screenshots.py
    artifacts:
      - store-artifacts/**
  store-preparation:
    name: Store details and simulator screenshots
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: Car Market Place (Admin)
    environment:
      xcode: 26.0
      node: 22
    scripts:
      - name: Update listing and inspect Apple status
        script: |
          python3 -m venv /tmp/store-tools
          /tmp/store-tools/bin/pip install 'PyJWT[crypto]' requests
          /tmp/store-tools/bin/python scripts/store-details.py
      - name: Build simulator app
        script: |
          npm ci
          npm run sync:ios
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO build > /tmp/simulator-build.log 2>&1
      - name: Capture real app screens
        script: python3 scripts/screenshots.py
    artifacts:
      - store-artifacts/**
      - /tmp/simulator-build.log
  ios-release:
    name: CarMarketplace iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Car Market Place (Admin)
    environment:
      xcode: 26.0
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.carmmarketug.app
      vars:
        IOS_BUILD_NUMBER: "2"
    scripts:
      - name: Install and sync iOS
        script: |
          npm ci
          npm run sync:ios
      - name: Set build number
        script: |
          node -e 'const fs=require("fs");const n=process.env.IOS_BUILD_NUMBER;if(!/^[1-9][0-9]{0,5}$/.test(n))throw Error("Use a positive sequential build number");const p="ios/App/App.xcodeproj/project.pbxproj";fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace(/CURRENT_PROJECT_VERSION = [0-9]+;/g,"CURRENT_PROJECT_VERSION = "+n+";"));'
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
