workflows:
  ios-release:
    name: CarMarketplace iOS
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CarMarketplace Apple
    environment:
      xcode: 26.0
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.carmmarketug.app
      vars:
        IOS_BUILD_NUMBER: "1"
    scripts:
      - name: Install and sync iOS
        script: |
          npm ci
          npm run sync:ios
      - name: Set build number
        script: |
          node -e 'const fs=require("fs");const n=process.env.IOS_BUILD_NUMBER;if(!/^[1-9][0-9]{0,5}$/.test(n))throw Error("Use a positive sequential build number");const p="ios/App/App.xcodeproj/project.pbxproj";fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace(/CURRENT_PROJECT_VERSION = [0-9]+;/g,"CURRENT_PROJECT_VERSION = "+n+";"));'
      - name: Resolve Swift packages
        script: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
